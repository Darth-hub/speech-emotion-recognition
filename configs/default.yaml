# Default training configuration

audio:
  sample_rate: 16000
  duration:    3.0

features:
  n_fft:      1024
  hop_length: 256
  n_mels:     64
  n_mfcc:     40
  n_chroma:   12

augmentation:
  prob:           0.5
  snr_db_initial: 25.0
  snr_db_final:    5.0
  pitch_shift_steps: [-2.0, 2.0]
  time_stretch_rate: [0.9, 1.1]

model:
  lstm_hidden: 128
  lstm_layers: 2
  dropout:     0.3

training:
  epochs:       50
  batch_size:   32
  lr:           3e-4
  weight_decay: 1e-4
  patience:     8
  num_workers:  4

paths:
  raw_data:    data/raw
  manifest:    data/processed/manifest.csv
  checkpoints: models/checkpoints
